<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head>
<body><canvas id="c"></canvas>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uMode;
uniform float uSeed;

#define PI 3.14159265

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<6;i++){ s+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
float fbm3(vec2 p){ float s=0., a=.5; for(int i=0;i<3;i++){ s+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
float dot2(vec2 v){ return dot(v,v); }

const vec3 LDIR = vec3(-0.55, 0.6, 0.78);
const vec3 LCOL = vec3(1.0, 0.90, 0.76);
const vec3 AMB  = vec3(0.50, 0.44, 0.42);

vec3 shade(vec3 base, vec3 n, float ks, float shin){
  vec3 L = normalize(LDIR);
  vec3 H = normalize(L + vec3(0,0,1));
  float d = max(dot(n,L), 0.);
  float s = pow(max(dot(n,H),0.), shin) * ks;
  return base*(AMB + LCOL*d*0.95) + LCOL*s;
}

float sdRoundBox(vec2 p, vec2 b, float r){ vec2 q = abs(p)-b+r; return min(max(q.x,q.y),0.) + length(max(q,0.)) - r; }
float sdStar5(vec2 p, float r, float m){
  float n = 5.;
  float an = PI/n, en = PI/m;
  vec2 acs = vec2(cos(an),sin(an)), ecs = vec2(cos(en),sin(en));
  float bn = mod(atan(p.x,p.y), 2.*an) - an;
  p = length(p)*vec2(cos(bn), abs(sin(bn)));
  p -= r*acs;
  p += ecs*clamp(-dot(p,ecs), 0., r*acs.y/ecs.y);
  return length(p)*sign(p.x);
}
float sdHeart(vec2 p){
  p.x = abs(p.x);
  if(p.y+p.x>1.0) return sqrt(dot2(p-vec2(0.25,0.75))) - sqrt(2.0)/4.0;
  return sqrt(min(dot2(p-vec2(0.0,1.0)), dot2(p-0.5*max(p.x+p.y,0.0)))) * sign(p.x-p.y);
}

// soft drop shadow helper: returns alpha of shadow for an sdf value
float softShadow(float d, float blur){ return 1. - smoothstep(-blur*0.5, blur, d); }

/* ---------------- TABLE ---------------- */
vec4 table(vec2 fc){
  vec2 uv = fc / uRes.y;           // height units
  float aspect = uRes.x/uRes.y;
  float ph = 0.36;                 // plank height
  float yy = uv.y/ph;
  float id = floor(yy), f = fract(yy);
  float ox = hash(vec2(id, 3.1+uSeed))*20.;
  // end joints
  float seg = 4.5 + hash(vec2(id,7.))*2.5;
  float jx = (uv.x + hash(vec2(id,11.))*seg)/seg;
  float jid = floor(jx), jf = fract(jx);
  ox += jid*13.7;
  vec2 gp = vec2(uv.x + ox, uv.y);
  float w = fbm(vec2(gp.x*0.9, gp.y*5.0));
  float rings = fract(gp.y*16. + w*5.5 + fbm(vec2(gp.x*0.35, gp.y*2.))*3.);
  float ringLine = smoothstep(0.0, 0.08, rings) * (1.-smoothstep(0.55, 1.0, rings));
  float fibers = fbm(vec2(gp.x*2.2, gp.y*260.));
  float pores = smoothstep(0.62, 0.8, noise(vec2(gp.x*60., gp.y*900.)));
  vec3 dark  = vec3(0.105, 0.060, 0.040);
  vec3 mid   = vec3(0.215, 0.120, 0.072);
  vec3 light = vec3(0.330, 0.190, 0.110);
  float tone = 0.35 + 0.65*hash(vec2(id+jid*3.1, 5.));
  vec3 col = mix(dark, mid, smoothstep(0.25, 0.75, w));
  col = mix(col, light, ringLine*0.35*tone);
  col *= 0.82 + 0.36*fibers;
  col *= 1. - pores*0.18;
  col *= 0.85 + 0.3*tone;
  // plank seams
  float ds = min(f, 1.-f)*ph;
  col *= 1. - 0.6*exp(-ds*700.);
  col += vec3(0.10,0.06,0.03) * exp(-pow((1.-f)*ph*260. - 1.4, 2.)) * 0.6; // top lip highlight
  float dj = min(jf, 1.-jf)*seg;
  col *= 1. - 0.55*exp(-dj*900.);
  // light pool + soft window sheen
  vec2 c = vec2(aspect*0.70, 0.62);
  float pool = exp(-dot2((uv-c)*vec2(0.55,0.85))*1.4);
  col *= 0.30 + 1.25*pool;
  float sheen = exp(-pow((uv.x*0.55 + uv.y*0.85) - (aspect*0.55+0.35), 2.)*7.);
  col += vec3(0.09,0.065,0.045)*sheen*(0.5+fibers*0.6);
  // scattered sugar crystals
  vec2 cg = fc/7.0; vec2 ci = floor(cg);
  float hc = hash(ci+uSeed);
  if(hc > 0.99965){
    vec2 cp = fract(cg)-0.5 + (vec2(hash(ci+1.3),hash(ci+2.7))-0.5)*0.5;
    float cr = 0.16 + 0.18*hash(ci+4.4);
    float m = 1.-smoothstep(cr*0.6, cr, length(cp));
    col = mix(col, vec3(0.88,0.84,0.78)*(0.5+pool), m*0.8);
  }
  // vignette
  vec2 vv = fc/uRes - 0.5;
  col *= 1. - 0.55*dot2(vv*vec2(1.0,1.15));
  return vec4(col, 1.);
}

/* ---------------- CUP ---------------- */
float handleSdf(vec2 p, vec2 c, float Rc){
  vec2 q = rot(0.38) * (p - c);           // pointing right, slightly down
  float outer = sdRoundBox(q - vec2(Rc+0.11, 0.), vec2(0.165, 0.082), 0.082);
  float inner = sdRoundBox(q - vec2(Rc+0.145, 0.), vec2(0.075, 0.03), 0.03);
  return max(outer, -inner);
}
vec4 cup(vec2 p){
  vec2 c = vec2(-0.10, 0.07);
  float Rs = 0.80, Rc = 0.50;
  vec3 col = vec3(0.); float a = 0.;
  vec2 shOff = vec2(0.075, -0.095);
  // saucer drop shadow
  float rS = length(p - c - shOff);
  float sh = softShadow(rS - Rs, 0.16)*0.62;
  float hS = handleSdf(p - shOff*1.35, c, Rc);
  sh = max(sh, softShadow(hS, 0.10)*0.5);
  float contact = softShadow(length(p-c-vec2(0.012,-0.018)) - Rs, 0.03)*0.4;
  sh = max(sh, contact);
  col = vec3(0.04,0.02,0.01); a = sh;

  vec3 glaze = vec3(0.905, 0.862, 0.800);
  float gtex = fbm3(p*18.);
  glaze *= 0.97 + 0.05*gtex;

  // saucer
  float r = length(p - c); vec2 dir = (p-c)/max(r,1e-4);
  if(r < Rs){
    float e = 0.002;
    #define SH(x) (smoothstep(0.52,0.70,x)*0.075 + 0.012*exp(-pow(((x)-0.745)/0.03,2.)) - smoothstep(0.765,0.80,x)*0.05)
    float dh = (SH(r+e)-SH(r-e))/(2.*e);
    vec3 n = normalize(vec3(-dh*dir, 1.));
    vec3 base = glaze;
    float band = 1.-smoothstep(0.0025, 0.0055, abs(r-0.705));
    base = mix(base, vec3(0.62,0.30,0.15), band*0.9);
    vec3 s = shade(base, n, 0.55, 70.) + LCOL*pow(max(dot(n, normalize(normalize(LDIR)+vec3(0,0,1))),0.), 400.)*0.8;
    // cup & handle shadow on saucer
    float cs = softShadow(length(p - c - vec2(0.05,-0.068)) - Rc, 0.10);
    float hs = softShadow(handleSdf(p - vec2(0.05,-0.07), c, Rc), 0.07);
    s *= 1. - 0.55*max(cs, hs*0.8);
    float edgeA = 1.-smoothstep(Rs-0.004, Rs, r);
    col = mix(col, s, edgeA); a = mix(a, 1., edgeA);
  }
  // handle
  float hd = handleSdf(p, c, Rc);
  if(hd < 0.){
    float e = 0.002;
    vec2 g = vec2(handleSdf(p+vec2(e,0),c,Rc)-handleSdf(p-vec2(e,0),c,Rc), handleSdf(p+vec2(0,e),c,Rc)-handleSdf(p-vec2(0,e),c,Rc));
    g = normalize(g+1e-6);
    float t = clamp(-hd/0.026, 0., 1.);
    vec3 n = normalize(vec3(g*(1.-t)*1.4, 0.25 + t));
    vec3 s = shade(glaze, n, 0.6, 80.);
    float m = 1.-smoothstep(-0.003, 0., hd);
    col = mix(col, s, m); a = mix(a, 1., m);
  }
  // cup
  if(r < Rc){
    vec3 s;
    float lipIn = 0.455, wallIn = 0.405;
    if(r > lipIn){
      float t = (r - lipIn)/(Rc - lipIn);           // 0 inner -> 1 outer
      float ang = mix(-1.1, 1.35, t);
      vec3 n = normalize(vec3(dir*sin(ang), cos(ang)));
      s = shade(glaze, n, 0.7, 90.);
    } else if(r > wallIn){
      float t = (r - wallIn)/(lipIn - wallIn);
      vec3 n = normalize(vec3(-dir*mix(1.0,0.75,t), mix(0.25,0.6,t)));
      s = shade(glaze*0.96, n, 0.5, 60.);
      s *= 0.78 + 0.22*t;
    } else {
      // liquid surface: crema + foam + cinnamon star
      vec2 lp = p - c;
      float wob = (fbm(dir*2.5 + vec2(r*3.0)) - 0.5);
      float cremaM = smoothstep(0.292, 0.312, r + wob*0.06);
      vec3 foam = vec3(0.925, 0.850, 0.735);
      float bub = noise(lp*380.); foam *= 0.95 + 0.05*bub;
      vec3 crema = mix(vec3(0.46,0.25,0.12), vec3(0.64,0.39,0.20), fbm(vec2(atan(lp.y,lp.x)*5., r*30.)));
      crema = mix(crema, vec3(0.33,0.17,0.08), smoothstep(0.37,0.405,r)*0.8);
      vec3 base = mix(foam, crema, cremaM);
      base = mix(base, vec3(0.70,0.47,0.28), exp(-pow((r + wob*0.06 - 0.30)/0.012, 2.))*0.45);
      // cinnamon dusting through a star stencil
      vec2 sp = rot(0.18)*lp;
      float sd = sdStar5(sp, 0.215, 2.55);
      float edge = sd + (noise(lp*90.)-0.5)*0.018;
      float mask = 1.-smoothstep(-0.006, 0.010, edge);
      float grain = noise(lp*520.);
      float grain2 = noise(lp*210. + 7.);
      float dust = mask*(0.55 + 0.45*grain) * (0.8 + 0.2*grain2);
      float over = (1.-mask)*step(0.93, hash(floor(lp*520.)))*smoothstep(0.08, 0.0, sd)*0.9;
      vec3 cinn = mix(vec3(0.50,0.24,0.10), vec3(0.62,0.33,0.15), grain2);
      base = mix(base, cinn, clamp(dust + over, 0., 1.)*0.92);
      vec3 n = normalize(vec3(lp*0.35, 1.));
      s = shade(base, n, 0.08, 20.);
      // meniscus glint and rim shadow on the light side
      float L2 = dot(dir, normalize(LDIR.xy));
      float rimSh = smoothstep(wallIn - 0.02 - 0.07*max(L2,0.), wallIn - 0.005, r) * smoothstep(-0.2, 0.6, L2);
      s *= 1. - 0.5*rimSh;
      s *= 1. - 0.25*smoothstep(wallIn-0.03, wallIn, r);
    }
    float m = 1.-smoothstep(Rc-0.003, Rc, r);
    col = mix(col, s, m); a = mix(a, 1., m);
  }
  return vec4(col, a);
}

/* ---------------- CINNAMON STICKS ---------------- */
vec4 stick(vec2 p, vec2 c, float ang, float L, float hw, float seed, vec4 acc){
  vec2 q = rot(ang)*(p-c);
  float endJit = (noise(vec2(q.y*30., seed))-0.5)*0.03;
  float d = sdRoundBox(q, vec2(L*0.5+endJit, hw), hw*0.35);
  // shadow
  vec2 qs = rot(ang)*(p - c - vec2(0.045,-0.06));
  float dsh = sdRoundBox(qs, vec2(L*0.5, hw), hw*0.35);
  float sh = softShadow(dsh, 0.09)*0.55;
  acc.rgb = mix(acc.rgb, vec3(0.03,0.015,0.01)*(1.-acc.a) + acc.rgb*acc.a, sh*(1.-acc.a));
  acc.a = acc.a + sh*(1.-acc.a);
  if(d < 0.){
    float v = clamp(q.y/hw, -1., 1.);
    vec3 nl = normalize(vec3(0., v*1.1, sqrt(max(1.-v*v, 0.05))));
    vec3 n = vec3(rot(-ang)*nl.xy, nl.z);
    float fib = fbm(vec2(q.x*5.+seed, q.y*70.));
    vec3 base = mix(vec3(0.40,0.18,0.08), vec3(0.62,0.32,0.15), fib);
    // scroll seam: the two curled edges meet near the top
    float seam = exp(-pow((v-0.22)*14., 2.));
    float lip = exp(-pow((v-0.34)*12., 2.));
    base *= 1. - 0.55*seam;
    base += vec3(0.12,0.06,0.03)*lip;
    base *= 0.95 + 0.1*noise(vec2(q.x*12., q.y*30.+seed));
    vec3 s = shade(base, n, 0.12, 18.);
    float m = 1.-smoothstep(-0.004, 0., d);
    acc.rgb = mix(acc.rgb, s, m); acc.a = mix(acc.a, 1., m);
  }
  return acc;
}
vec4 sticks(vec2 p){
  vec4 acc = vec4(0.);
  acc = stick(p, vec2(0.02, 0.16), -0.10, 1.55, 0.15, 1., acc);
  acc = stick(p, vec2(-0.04, -0.16), 0.08, 1.45, 0.14, 7., acc);
  return acc;
}

/* ---------------- STAR ANISE ---------------- */
vec4 anise(vec2 p){
  vec4 acc = vec4(0.);
  p = rot(0.2)*p;
  float r = length(p); float an = atan(p.y, p.x);
  float k = 8.;
  float seg = floor((an+PI)/(2.*PI/k));
  float ca = (seg+0.5)*(2.*PI/k) - PI;
  vec2 q = rot(ca)*p;          // pod along +x
  float jitL = 0.80 + 0.12*hash(vec2(seg, 3.));
  // pod: pointed boat from 0.06 to jitL
  float tt = (q.x-0.06)/jitL;
  float wdt = 0.13*pow(max(sin(PI*clamp(tt,0.,1.)),0.), 0.75) * (1.-0.25*tt);
  float pod = (tt>0. && tt<1.) ? (abs(q.y) - wdt) : 1.;
  pod = max(pod, -1.) ;
  vec2 pc = vec2((tt-0.5)*jitL, q.y);
  vec2 qs = rot(ca)*(p-vec2(0.04,-0.05));
  float tts = (qs.x-0.06)/jitL;
  float ws = 0.13*pow(max(sin(PI*clamp(tts,0.,1.)),0.), 0.75)*(1.-0.25*tts);
  float shp = (tts>-0.05 && tts<1.05) ? softShadow(abs(qs.y)-ws, 0.06) : 0.;
  float core = length(p) - 0.12;
  float shAll = max(shp, softShadow(length(p-vec2(0.04,-0.05))-0.14, 0.06))*0.55;
  acc = vec4(vec3(0.03,0.015,0.01), shAll);
  float d = min(pod, core);
  if(d < 0.){
    vec3 base; vec3 n;
    if(pod < core){
      float v = clamp(q.y/max(wdt,0.01), -1., 1.);
      vec3 nl = normalize(vec3(-pc.x*0.6, v*0.9, 1.0 - 0.6*abs(v)));
      n = vec3(rot(-ca)*nl.xy, nl.z);
      base = mix(vec3(0.28,0.12,0.05), vec3(0.52,0.26,0.11), fbm(q*30.));
      base *= 0.8 + 0.35*noise(q*140.);
      base *= 1. - 0.35*exp(-pow(v*5.,2.));   // keel line
      // open slit with seed
      float slit = length((pc - vec2(-0.02,0.))/vec2(jitL*0.24, 0.045)) - 1.;
      if(slit < 0.){
        float seed = length((pc - vec2(-0.02,0.))/vec2(jitL*0.13, 0.032)) - 1.;
        base = vec3(0.16,0.07,0.03);
        if(seed < 0.){
          base = vec3(0.42,0.24,0.11);
          vec2 sv = (pc - vec2(-0.02,0.))/vec2(jitL*0.13,0.032);
          vec3 nl2 = normalize(vec3(sv*0.8, 1.));
          n = vec3(rot(-ca)*nl2.xy, nl2.z);
          vec3 s = shade(base, n, 0.7, 120.);
          acc = vec4(s, 1.); return acc;
        }
      }
      vec3 s = shade(base, n, 0.15, 25.);
      float m = 1.-smoothstep(-0.004, 0., d);
      acc.rgb = mix(acc.rgb, s, m); acc.a = mix(acc.a, 1., m);
    } else {
      base = vec3(0.30,0.14,0.06)*(0.8+0.4*noise(p*60.));
      n = normalize(vec3(p*2., 1.));
      acc = vec4(shade(base, n, 0.1, 20.), 1.);
    }
  }
  return acc;
}

/* ---------------- SUGAR CUBES ---------------- */
vec4 cube(vec2 p, vec2 c, float ang, float s, vec4 acc){
  vec2 q = rot(ang)*(p-c);
  float d = sdRoundBox(q, vec2(s), s*0.12);
  float sh = softShadow(sdRoundBox(rot(ang)*(p-c-vec2(0.05,-0.065)), vec2(s), s*0.12), 0.10)*0.55;
  acc.rgb = mix(acc.rgb, vec3(0.03,0.02,0.015), sh*(1.-acc.a)); acc.a = acc.a + sh*(1.-acc.a);
  if(d < 0.){
    float e = clamp(-d/(s*0.16), 0., 1.);
    vec2 g = normalize(vec2(
      sdRoundBox(q+vec2(0.002,0),vec2(s),s*0.12)-sdRoundBox(q-vec2(0.002,0),vec2(s),s*0.12),
      sdRoundBox(q+vec2(0,0.002),vec2(s),s*0.12)-sdRoundBox(q-vec2(0,0.002),vec2(s),s*0.12))+1e-6);
    g = rot(-ang)*g;
    vec3 n = normalize(vec3(g*(1.-e)*1.6, 0.3+e));
    float gr = noise(q*260.); float gr2 = noise(q*90.+3.);
    vec3 base = vec3(0.95,0.93,0.90)*(0.9+0.1*gr2);
    vec3 col = shade(base, n, 0.1, 10.);
    col *= 0.9 + 0.1*gr;
    // crystal glints
    float gl = step(0.985, hash(floor(q*300.)));
    col += vec3(1.0,0.97,0.9)*gl*0.6;
    float m = 1.-smoothstep(-0.004, 0., d);
    acc.rgb = mix(acc.rgb, col, m); acc.a = mix(acc.a, 1., m);
  }
  return acc;
}
vec4 cubes(vec2 p){
  vec4 acc = vec4(0.);
  acc = cube(p, vec2(-0.30, 0.10), 0.35, 0.30, acc);
  acc = cube(p, vec2(0.36, -0.14), -0.22, 0.30, acc);
  return acc;
}

/* ---------------- HEART WAFFLE ---------------- */
float waffleSdf(vec2 p){
  float d = 1e3;
  for(int k=0;k<5;k++){
    float a = float(k)*2.*PI/5.;
    vec2 q = rot(-a)*p;  // heart axis along +y
    q.y -= 0.035;
    float s = 0.47;
    d = min(d, sdHeart(q/s)*s);
  }
  return min(d, length(p) - 0.16);
}
vec4 waffle(vec2 p){
  vec4 acc = vec4(0.);
  float Rp = 0.96;
  float r = length(p);
  vec2 shOff = vec2(0.06,-0.08);
  float sh = max(softShadow(length(p-shOff)-Rp, 0.14)*0.6, softShadow(length(p-vec2(0.012,-0.016))-Rp, 0.03)*0.4);
  acc = vec4(vec3(0.04,0.02,0.01), sh);
  vec3 glaze = vec3(0.935,0.895,0.835)*(0.97+0.05*fbm3(p*18.));
  if(r < Rp){
    float e = 0.002;
    #define PH(x) (smoothstep(0.70,0.88,x)*0.06 + 0.01*exp(-pow(((x)-0.92)/0.025,2.)) - smoothstep(0.935,0.96,x)*0.04)
    vec2 dir = p/max(r,1e-4);
    float dh = (PH(r+e)-PH(r-e))/(2.*e);
    vec3 n = normalize(vec3(-dh*dir, 1.));
    vec3 base = glaze;
    float band = 1.-smoothstep(0.003, 0.006, abs(r-0.89));
    base = mix(base, vec3(0.62,0.30,0.15), band*0.9);
    vec3 s = shade(base, n, 0.55, 70.);
    float ws = softShadow(waffleSdf(p - vec2(0.035,-0.045)), 0.07);
    s *= 1. - 0.5*ws;
    float m = 1.-smoothstep(Rp-0.004, Rp, r);
    acc.rgb = mix(acc.rgb, s, m); acc.a = mix(acc.a, 1., m);
  }
  float d = waffleSdf(p);
  if(d < 0.){
    // grid pockets
    vec2 gq = rot(0.785)*p/0.085;
    vec2 gf = fract(gq)-0.5;
    float cell = max(abs(gf.x), abs(gf.y));
    float pocket = smoothstep(0.42, 0.37, cell);      // 1 inside pocket
    float hgt = 1. - pocket;
    float edgeRound = clamp(-d/0.05, 0., 1.);
    // normal: pocket walls + rounded outer edge
    vec2 pg = (abs(gf.x)>abs(gf.y)) ? vec2(sign(gf.x),0.) : vec2(0.,sign(gf.y));
    pg = rot(-0.785)*pg;
    float wall = smoothstep(0.30, 0.38, cell)*smoothstep(0.44, 0.39, cell);
    float e = 0.002;
    vec2 g = normalize(vec2(waffleSdf(p+vec2(e,0))-waffleSdf(p-vec2(e,0)), waffleSdf(p+vec2(0,e))-waffleSdf(p-vec2(0,e)))+1e-6);
    vec3 n = normalize(vec3(-pg*wall*0.9 + g*(1.-edgeRound)*1.3, 1.));
    float brown = fbm(p*7.);
    vec3 base = mix(vec3(0.88,0.62,0.30), vec3(0.66,0.38,0.15), smoothstep(0.35,0.75,brown));
    // grooves between the five hearts
    float sa = atan(p.y,p.x) + PI*0.5;
    float segA = mod(sa + PI/5., 2.*PI/5.) - PI/5.;
    float groove = exp(-pow(segA*length(p)/0.012, 2.))*smoothstep(0.08,0.2,length(p));
    base *= 1. - 0.45*groove;
    base = mix(base, vec3(0.50,0.27,0.10), (1.-edgeRound)*0.5);
    base *= mix(0.88, 1.0, hgt);
    vec3 s = shade(base, n, 0.25, 30.);
    s *= mix(0.86, 1., hgt);
    s *= 1. - 0.35*groove;
    // powdered sugar dusting
    float dm = smoothstep(0.75, 0.15, length(p+vec2(0.06,-0.05)) + (fbm(p*6.)-0.5)*0.35);
    float speck = noise(p*480.);
    float sug = dm*(0.12 + 0.88*hgt)*smoothstep(0.45, 0.8, speck + dm*0.2);
    s = mix(s, vec3(0.97,0.95,0.92)*(AMB+LCOL*0.75), clamp(sug,0.,1.)*0.9);
    float m = 1.-smoothstep(-0.004, 0., d);
    acc.rgb = mix(acc.rgb, s, m); acc.a = mix(acc.a, 1., m);
  }
  // a little overspray on the plate
  float os = step(0.985, hash(floor(p*420.)))*smoothstep(0.9, 0.3, r)*step(0., waffleSdf(p))*acc.a;
  acc.rgb = mix(acc.rgb, vec3(0.98,0.96,0.93), os*0.8);
  return acc;
}

void main(){
  vec2 fc = gl_FragCoord.xy;
  vec2 p = (fc - 0.5*uRes)/(0.5*uRes.y);
  vec4 o;
  if(uMode < 0.5) o = table(fc);
  else if(uMode < 1.5) o = cup(p);
  else if(uMode < 2.5) o = sticks(p);
  else if(uMode < 3.5) o = anise(p);
  else if(uMode < 4.5) o = cubes(p);
  else o = waffle(p);
  // subtle grain + gentle filmic tone
  o.rgb += (hash(fc+uSeed*13.)-0.5)*0.018;
  o.rgb = pow(max(o.rgb, 0.), vec3(0.95));
  gl_FragColor = vec4(clamp(o.rgb,0.,1.), clamp(o.a,0.,1.));
}
</script>
<script>
window.render = function(mode, w, h, seed){
  const c = document.getElementById('c'); c.width = w; c.height = h;
  const gl = c.getContext('webgl', {premultipliedAlpha:false, preserveDrawingBuffer:true, alpha:true, antialias:false});
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, 'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}'); gl.compileShader(vs);
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, document.getElementById('fs').textContent); gl.compileShader(fs);
  if(!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(fs));
  const pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr); gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(gl.getUniformLocation(pr,'uRes'), w, h);
  gl.uniform1f(gl.getUniformLocation(pr,'uMode'), mode);
  gl.uniform1f(gl.getUniformLocation(pr,'uSeed'), seed||0);
  gl.viewport(0,0,w,h); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish();
  return c.toDataURL('image/png');
};
